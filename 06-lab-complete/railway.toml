# Railway: build bằng Dockerfile; Railway cấp biến PORT, CMD trong Dockerfile đọc ${PORT}.
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ENVIRONMENT...) đặt trên dashboard hoặc
# bằng `railway variables set`, KHÔNG ghi giá trị vào file này.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
